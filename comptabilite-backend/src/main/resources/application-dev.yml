spring:
  datasource:
    url: jdbc:h2:file:./data/comptadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

ai:
  provider: ${AI_PROVIDER:gemini}   # gemini or claude

anthropic:
  api-key: ${ANTHROPIC_API_KEY:changeme-set-ANTHROPIC_API_KEY-env-var}

gemini:
  api-key: ${GEMINI_API_KEY:changeme-set-GEMINI_API_KEY-env-var}